<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación Revelación</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

#startScreen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:url("fondo-ositos.png") no-repeat center center;
background-size:cover;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:15%;
z-index:10;
}

#startBtn{
background:rgba(255,150,210,.95);
border:none;
border-radius:40px;
padding:18px 40px;
font-size:22px;
color:white;
cursor:pointer;
animation:pulse 2s infinite;
box-shadow:0 0 20px white;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

#card{
position:relative;
width:100%;
max-width:420px;
aspect-ratio: 9 / 16;
background:url("fondo-ositos.png") no-repeat center center;
background-size:cover;
display:none;
}

/* zonas tocables exactas */
.hotspot{
position:absolute;
}

/* calibradas para móviles */
#boy{
top:64%;
left:8%;
width:38%;
height:6%;
}

#girl{
top:64%;
right:8%;
width:38%;
height:6%;
}

#map{
top:72%;
left:8%;
width:38%;
height:6%;
}

#rsvp{
top:72%;
right:8%;
width:38%;
height:6%;
}

.float{
position:absolute;
font-size:28px;
animation:fall 5s linear;
}

@keyframes fall{
from{transform:translateY(-10vh);}
to{transform:translateY(110vh);}
}

.popup{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:center;
z-index:20;
}

.popup-content{
background:white;
padding:25px;
border-radius:25px;
text-align:center;
width:90%;
max-width:320px;
}

.popup-content button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff9fcf;
color:white;
font-size:16px;
}

ul{text-align:left;}
</style>
</head>

<body>

<div id="startScreen">
<button id="startBtn" onclick="startInvitation()">🎵 Abrir Invitación 🎵</button>
</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/05/16/audio_5c6b5fa9ff.mp3" type="audio/mpeg">
</audio>

<div id="card">
<div id="boy" class="hotspot" onclick="teamBoy()"></div>
<div id="girl" class="hotspot" onclick="teamGirl()"></div>
<div id="map" class="hotspot" onclick="openMap()"></div>
<div id="rsvp" class="hotspot" onclick="rsvp()"></div>
</div>

<div class="popup" id="popup">
<div class="popup-content" id="popupContent"></div>
</div>

<script>
const music=document.getElementById("music");

function startInvitation(){
document.getElementById("startScreen").style.display="none";
document.getElementById("card").style.display="block";
music.play();
}

function openMap(){
window.open("https://www.google.com/maps/search/?api=1&query=1412+Chariot+Dr+Murfreesboro+TN+37130");
}

function rsvp(){
const msg=encodeURIComponent("Hola María y Wilder 💕 Confirmo mi asistencia 🎉");
window.open("https://wa.me/16294628232?text="+msg);
}

function showPopup(emoji,title,items){
const popup=document.getElementById("popup");
const content=document.getElementById("popupContent");
content.innerHTML=`<h2>${title}</h2>
<h4>🎁 Ideas de regalos:</h4>
<ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>
<button onclick="closePopup()">Cerrar</button>`;
popup.style.display="flex";

for(let i=0;i<25;i++){
let e=document.createElement("div");
e.className="float";
e.innerHTML=emoji;
e.style.left=Math.random()*100+"vw";
document.body.appendChild(e);
setTimeout(()=>e.remove(),5000);
}
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function teamBoy(){
showPopup("🧸","💙 TEAM BOY 💙",[
"👕 Ropita azul",
"🧷 Pañales",
"🍼 Biberones",
"🛏️ Manta",
"🧸 Juguetes"
]);
}

function teamGirl(){
showPopup("🌸","💖 TEAM GIRL 💖",[
"👗 Vestiditos",
"🧷 Pañales",
"🍼 Baberos",
"🛏️ Cobijita",
"🎀 Muñequitas"
]);
}
</script>

</body>
</html>
